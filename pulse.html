<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RT-OS Pulse — Richie's Tavern</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--green:#1a2e24;--brass:#c9a84c;--brass-dim:#8a7030;--cream:#e8dcc8;--cream-dim:#b8a888;--dark:#0d1510;--brick:#8b3a3a}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--dark);color:var(--cream);min-height:100vh;overflow-x:hidden}
.topbar{background:rgba(26,46,36,.8);border-bottom:1px solid rgba(201,168,76,.1);padding:.8rem 2rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar h1{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--brass)}
.container{max-width:800px;margin:0 auto;padding:2rem;text-align:center}
h2{font-family:'Playfair Display',serif;font-size:2rem;color:var(--brass);margin:3rem 0 1rem}
p{color:var(--cream-dim);font-size:1rem;line-height:1.6;margin-bottom:1.5rem}
.rule{width:60px;height:1px;background:var(--brass);margin:2rem auto;opacity:.5}
a{color:var(--brass);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .2s}
a:hover{border-bottom-color:var(--brass)}
</style>
</head>
<body>
<div class="topbar">
  <h1>RT-OS Pulse</h1>
  <a href="hub.html" style="font-size:.8rem;color:var(--cream-dim)">← Hub</a>
</div>
<div class="container">
  <h2>Pulse</h2>
  <div class="rule"></div>
  <p>Real-time tavern dashboard — coming with the Sept 16 launch.</p>
  <p><a href="hub.html">Return to Hub</a></p>
</div>
</body>
</html>

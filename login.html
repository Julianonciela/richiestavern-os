<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RT-OS — Richie's Tavern Operating System</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--green:#1a2e24;--brass:#c9a84c;--brass-dim:#8a7030;--cream:#e8dcc8;--cream-dim:#b8a888;--dark:#0d1510;--brick:#8b3a3a}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--dark);color:var(--cream);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
.login-box{background:rgba(26,46,36,.7);border:1px solid rgba(201,168,76,.15);border-radius:14px;padding:3rem 2.5rem;max-width:420px;width:100%;text-align:center}
.login-box h1{font-family:'Playfair Display',serif;font-size:2rem;color:var(--brass);margin-bottom:.3rem}
.login-box .tagline{font-size:.85rem;color:var(--brass-dim);margin-bottom:2rem}
.login-box label{display:block;text-align:left;font-size:.75rem;color:var(--cream-dim);margin-bottom:.3rem;text-transform:uppercase;letter-spacing:1px}
.login-box select,.login-box input{width:100%;padding:.7rem;margin-bottom:1rem;background:rgba(13,21,16,.8);border:1px solid rgba(201,168,76,.2);border-radius:6px;color:var(--cream);font-family:'DM Sans',sans-serif;font-size:.9rem}
.login-box select:focus,.login-box input:focus{outline:none;border-color:var(--brass)}
.login-box button{width:100%;padding:.8rem;background:var(--brass);color:var(--dark);border:none;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:.9rem;font-weight:600;cursor:pointer;transition:opacity .2s}
.login-box button:hover{opacity:.85}
.error{color:#d4726a;font-size:.8rem;margin-top:.8rem;display:none}
.rule{width:50px;height:1px;background:var(--brass);margin:1.5rem auto;opacity:.5}
</style>
</head>
<body>
<div class="login-box">
  <h1>RT-OS</h1>
  <p class="tagline">Richie's Tavern · Operating System</p>
  <div class="rule"></div>
  <label for="role">Role</label>
  <select id="role">
    <option value="superadmin">Superadmin — Juliano</option>
    <option value="direction">Direction — Richie / Uli</option>
    <option value="staff">Staff — Équipe</option>
  </select>
  <label for="pass">Access Code</label>
  <input type="password" id="pass" placeholder="Enter your code" autofocus>
  <button id="login-btn">Enter RT-OS</button>
  <p class="error" id="error">Invalid code. Try again.</p>
</div>

<script>
const users={
  superadmin:{code:'juliano2026',name:'Juliano'},
  direction:{code:'richie2026',name:'Direction'},
  staff:{code:'teamrt2026',name:'Staff'}
};
document.getElementById('login-btn').addEventListener('click',()=>{
  const role=document.getElementById('role').value;
  const pass=document.getElementById('pass').value;
  if(users[role]&&users[role].code===pass){
    localStorage.setItem('rtos_role',role);
    localStorage.setItem('rtos_name',users[role].name);
    if(role==='superadmin')window.location='admin.html';
    else if(role==='direction')window.location='hub.html';
    else window.location='academy.html';
  }else{document.getElementById('error').style.display='block';}
});
document.getElementById('pass').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('login-btn').click();});
</script>
</body>
</html>

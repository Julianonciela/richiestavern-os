<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RT-OS Academy — Richie's Tavern</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--green:#1a2e24;--brass:#c9a84c;--brass-dim:#8a7030;--cream:#e8dcc8;--cream-dim:#b8a888;--dark:#0d1510;--brick:#8b3a3a}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--dark);color:var(--cream);min-height:100vh}
.topbar{background:rgba(26,46,36,.8);border-bottom:1px solid rgba(201,168,76,.1);padding:.8rem 2rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar h1{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--brass)}
.topbar .user{font-size:.8rem;color:var(--cream-dim)}
.topbar .logout{background:none;border:1px solid rgba(201,168,76,.2);color:var(--brass-dim);padding:.3rem .8rem;border-radius:4px;cursor:pointer;font-size:.75rem}
.topbar .logout:hover{color:var(--brass);border-color:var(--brass)}
.container{max-width:900px;margin:0 auto;padding:2rem}
h2{font-family:'Playfair Display',serif;font-size:1.5rem;color:var(--brass);margin-bottom:1.5rem}
.lesson{background:rgba(26,46,36,.5);border:1px solid rgba(201,168,76,.1);border-radius:10px;padding:1.5rem;margin-bottom:.8rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:1rem}
.lesson:hover{border-color:rgba(201,168,76,.25);background:rgba(26,46,36,.7)}
.lesson .icon{font-size:1.8rem;flex-shrink:0}
.lesson .info{flex:1}
.lesson .info h3{font-family:'Playfair Display',serif;font-size:1rem;color:var(--brass);margin-bottom:.2rem}
.lesson .info p{font-size:.8rem;color:var(--cream-dim)}
.lesson .status{font-size:.7rem;padding:.2rem .6rem;border-radius:10px;flex-shrink:0}
.status.new{background:rgba(201,168,76,.15);color:var(--brass)}
.status.done{background:rgba(26,46,36,.5);color:var(--cream-dim)}
.badge{font-family:'Playfair Display',serif;font-size:.9rem;color:var(--brass);margin-bottom:1.5rem;padding:.6rem 1rem;background:rgba(201,168,76,.08);border-radius:6px;display:inline-block}

/* Lesson viewer */
#lesson-view{display:none;position:fixed;inset:0;z-index:100;background:var(--dark);padding:2rem;overflow-y:auto}
#lesson-view .back{background:none;border:1px solid rgba(201,168,76,.2);color:var(--brass);padding:.4rem 1rem;border-radius:6px;cursor:pointer;margin-bottom:1.5rem;font-family:'DM Sans',sans-serif}
#lesson-view .back:hover{border-color:var(--brass)}
#lesson-content{max-width:700px;margin:0 auto;font-size:.95rem;line-height:1.8}
#lesson-content h2{font-size:1.8rem}
#lesson-content p{margin-bottom:1rem;color:var(--cream-dim)}
#lesson-content ul{padding-left:1.5rem;margin-bottom:1rem;color:var(--cream-dim)}
#lesson-content strong{color:var(--cream)}
.rule{width:40px;height:1px;background:var(--brass);margin:.8rem 0 1.5rem;opacity:.5}

@media(max-width:768px){.topbar{padding:.8rem 1rem}.container{padding:1rem}}
</style>
</head>
<body>
<div class="topbar">
  <h1>RT-OS Academy</h1>
  <span class="user" id="user-label"></span>
  <button class="logout" onclick="logout()">Leave</button>
</div>
<div class="container">
  <h2>📚 Hospitality Training</h2>
  <div class="badge" id="progress-badge">0 / 0 lessons completed</div>
  <div id="lesson-list"></div>
</div>

<div id="lesson-view"><div id="lesson-content"></div></div>

<script>
const role=localStorage.getItem('rtos_role');
if(!role){window.location='index.html';}
document.getElementById('user-label').textContent='👤 '+localStorage.getItem('rtos_name');
function logout(){localStorage.clear();window.location='index.html';}

const lessons=[
  {id:1,icon:'🏠',title:'The First Impression',desc:'Why the first 30 seconds set the tone for the entire meal',file:'lesson-1.md'},
  {id:2,icon:'👀',title:'Reading the Room',desc:'How to see what the guest needs before they ask',file:'lesson-2.md'},
  {id:3,icon:'🔄',title:'The Service Sequence',desc:'The choreographed 10-step flow that runs every table, every night',file:'lesson-3.md'},
  {id:4,icon:'🛡️',title:'Handling Difficult Moments',desc:'Acknowledge, Act, Follow Up — the framework for every curveball',file:'lesson-4.md'},
  {id:5,icon:'🧹',title:'Invisible Service',desc:'Clearing, resetting, and moving through the room without being noticed',file:'lesson-5.md'},
];

const completed=JSON.parse(localStorage.getItem('rtos_completed')||'[]');
function renderList(){
  document.getElementById('lesson-list').innerHTML=lessons.map(l=>{
    const done=completed.includes(l.id);
    return`<div class="lesson" onclick="openLesson(${l.id})">
      <div class="icon">${l.icon}</div>
      <div class="info"><h3>${done?'✓ ':''}${l.title}</h3><p>${l.desc}</p></div>
      <span class="status ${done?'done':'new'}">${done?'DONE':'START'}</span>
    </div>`;
  }).join('');
  document.getElementById('progress-badge').textContent=`${completed.length} / ${lessons.length} lessons completed`;
}
renderList();

async function openLesson(id){
  const l=lessons.find(x=>x.id===id);
  const view=document.getElementById('lesson-view');
  const content=document.getElementById('lesson-content');
  content.innerHTML='<button class="back" onclick="closeLesson()">← Back to Academy</button><div class="rule"></div><p>Loading...</p>';
  view.style.display='block';
  try{
    const res=await fetch('academy/'+l.file);
    if(res.ok){
      const md=await res.text();
      content.innerHTML='<button class="back" onclick="closeLesson()">← Back to Academy</button><div class="rule"></div>'+mdToHtml(md);
    }else{
      content.innerHTML='<button class="back" onclick="closeLesson()">← Back to Academy</button><div class="rule"></div><h2>'+l.title+'</h2><p>'+l.desc+'</p><p style="color:var(--brass-dim)">Full lesson content coming soon. Juliano is writing it.</p>';
    }
    if(!completed.includes(id)){completed.push(id);localStorage.setItem('rtos_completed',JSON.stringify(completed));renderList();}
  }catch(e){
    content.innerHTML='<button class="back" onclick="closeLesson()">← Back to Academy</button><div class="rule"></div><h2>'+l.title+'</h2><p>'+l.desc+'</p><p style="color:var(--brass-dim)">Lesson content offline or not yet deployed.</p>';
  }
}
function closeLesson(){document.getElementById('lesson-view').style.display='none';}

function mdToHtml(md){
  return md
    .replace(/^### (.+)/gm,'<h3>$1</h3>')
    .replace(/^## (.+)/gm,'<h2>$1</h2>')
    .replace(/^# (.+)/gm,'<h1>$1</h1>')
    .replace(/^- (.+)/gm,'<li>$1</li>')
    .replace(/(<li>.*<\/li>)/s,function(m){return'<ul>'+m+'</ul>';})
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\n\n/g,'</p><p>')
    .replace(/^(.+)$/gm,function(m){return m.startsWith('<')?m:'<p>'+m+'</p>';});
}
</script>
</body>
</html>
